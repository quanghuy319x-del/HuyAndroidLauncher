name: Build Glass Home APK
on:
  push:
    branches: [main]
    paths:
      - 'glass-home-launcher/**'
      - '.github/workflows/glass-home-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand Glass Home Android source
        run: |
          mkdir -p glass-home-launcher/project
          tar -xJf glass-home-launcher/source.tar.xz -C glass-home-launcher/project
          test -f glass-home-launcher/project/app/src/main/java/dev/glasshome/launcher/MainActivity.java
      - name: Apply Pixel Home v5 interaction upgrades
        run: python3 glass-home-launcher/upgrade-to-v5.py glass-home-launcher/project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "Using Android SDK at $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable Android APK
        run: gradle --no-daemon -p glass-home-launcher/project assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelHome-v5-debug-apk
          path: glass-home-launcher/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload editable source and preview
        uses: actions/upload-artifact@v4
        with:
          name: PixelHome-v5-source-preview
          path: |
            glass-home-launcher/project/PREVIEW.html
            glass-home-launcher/project/README.md
          if-no-files-found: error
