name: Build Minute Timer APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'MinuteWidget/**'
      - '.github/workflows/minute-widget.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle -p MinuteWidget assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MinuteTimer-debug-apk
          path: MinuteWidget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
