name: Build Lawnchair-based Pixel Home

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lawnchair-based/**'
      - '.github/workflows/lawnchair-based-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout custom patches
        uses: actions/checkout@v4
      - name: Checkout official Lawnchair 16 source
        run: |
          git clone --depth 1 --branch 16-dev https://github.com/LawnchairLauncher/lawnchair.git upstream-lawnchair
          git -C upstream-lawnchair fetch --depth 1 origin 85335d904a1c8b9790e40c581226684c59166297
          git -C upstream-lawnchair checkout 85335d904a1c8b9790e40c581226684c59166297
          git -C upstream-lawnchair submodule update --init --recursive --depth 1
      - name: Apply Pixel Home changes
        run: python3 lawnchair-based/patch_lawnchair.py upstream-lawnchair
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Install Android SDK platform for Lawnchair
        run: |
          echo "SDK installed at $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Compile official Lawnchair engine with custom patch
        working-directory: upstream-lawnchair
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleLawnWithQuickstepGithubDebug
      - name: Publish actual APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelHome-LawnchairBased-debug-APK
          path: upstream-lawnchair/build/outputs/apk/**/*.apk
          if-no-files-found: error
